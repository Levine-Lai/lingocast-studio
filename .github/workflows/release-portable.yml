name: Verify and build Windows portable app

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/release-portable.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Validate aligned versions
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($packageVersion -ne $tauriVersion -or $packageVersion -ne $cargoVersion) {
            throw "Version mismatch: package=$packageVersion tauri=$tauriVersion cargo=$cargoVersion"
          }
          "LINGOCAST_VERSION=$packageVersion" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build portable application
        run: npm run tauri -- build --no-bundle

      - name: Prepare portable executable
        shell: pwsh
        run: |
          $name = "LingoCast Studio_$env:LINGOCAST_VERSION`_portable.exe"
          Copy-Item -LiteralPath "src-tauri/target/release/lingocast-studio.exe" -Destination $name

      - name: Upload portable executable
        uses: actions/upload-artifact@v7
        with:
          name: LingoCast-Studio-Windows-${{ github.run_number }}
          path: desktop/LingoCast Studio_*_portable.exe
          if-no-files-found: error
          retention-days: 90
